name: Checkov

on:
  push:
    branches: [main]
    paths:
      - "modules/**"
      - "environments/**"
      - ".github/workflows/checkov.yml"
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  checkov:
    name: Scan Terraform
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run Checkov
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: .
          framework: terraform
          soft_fail: false
          quiet: true
